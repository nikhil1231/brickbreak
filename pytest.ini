[pytest]
testpaths = tests
# Tests that hit a live NSE endpoint are excluded by default: they are slow,
# they fail on a plane, and NSE rate-limits. Run them deliberately with
#   .venv/bin/python -m pytest -m network
markers =
    network: hits a live NSE endpoint
    power: Monte-Carlo power/size studies; minutes, not seconds
addopts = -m "not network and not power"
